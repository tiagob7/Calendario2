<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visitas</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="css/visitas.css">
<script>if(localStorage.getItem('darkMode')==='1')document.documentElement.classList.add('dark');</script>
</head>
<body>

<div class="page">

  <div class="page-head">
    <div>
      <div class="kicker">Trabalho de campo</div>
      <h1>Visitas</h1>
      <p class="lede" id="pageSubtitle">Registo e acompanhamento de visitas a clientes e parceiros.</p>
    </div>
    <div class="hd-actions">
      <span id="syncStatus"></span>
      <select id="filterEscritorio" class="filter-escritorio-sel" style="display:none;" onchange="setFiltroEscritorio(this.value)">
        <option value="">Todos</option>
      </select>
      <button class="btn btn-primary btn-sm" onclick="openForm()">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M8 2v12M2 8h12"/></svg>
        Nova visita
      </button>
    </div>
  </div>

  <div class="stat-grid">
    <div class="stat-tile">
      <div class="stat-tile-label">Total</div>
      <div class="stat-tile-val" id="statTotal">—</div>
    </div>
    <div class="stat-tile">
      <div class="stat-tile-label">Agendadas</div>
      <div class="stat-tile-val s-agendada" id="statAgendada">—</div>
    </div>
    <div class="stat-tile">
      <div class="stat-tile-label">Realizadas</div>
      <div class="stat-tile-val s-realizada" id="statRealizada">—</div>
    </div>
  </div>

  <div class="toolbar-card">
    <div class="seg-ctrl">
      <button class="seg-btn active" data-f="todos" onclick="setFiltro('todos')">Todos</button>
      <button class="seg-btn" data-f="agendada" onclick="setFiltro('agendada')">Agendadas</button>
      <button class="seg-btn" data-f="realizada" onclick="setFiltro('realizada')">Realizadas</button>
      <button class="seg-btn" data-f="cancelada" onclick="setFiltro('cancelada')">Canceladas</button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-right">
      <span class="count-badge" id="countBadge"></span>
    </div>
  </div>

  <div class="visitas-list" id="visitasList"></div>

</div>

<!-- Form modal -->
<div class="modal-overlay" id="visitaFormModal" onclick="if(event.target===this)closeForm()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-head">
      <span class="modal-title">Nova visita</span>
      <button class="modal-close" onclick="closeForm()">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l10 10M13 3L3 13"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="field full">
          <label class="field-label">Cliente / Entidade *</label>
          <input class="input" id="fCliente" placeholder="ex: Empresa ABC" maxlength="100" autocomplete="off">
        </div>
        <div class="field">
          <label class="field-label">Local</label>
          <input class="input" id="fLocal" placeholder="ex: Lisboa, Escritório do cliente" maxlength="100" autocomplete="off">
        </div>
        <div class="field">
          <label class="field-label">Data da visita *</label>
          <input type="date" class="input" id="fData">
        </div>
        <div class="field">
          <label class="field-label">Tipo</label>
          <select class="select" id="fTipo">
            <option value="reuniao">Reunião</option>
            <option value="demonstracao">Demonstração</option>
            <option value="auditoria">Auditoria</option>
            <option value="formacao">Formação</option>
            <option value="outro">Outro</option>
          </select>
        </div>
        <div class="field">
          <label class="field-label">Responsável</label>
          <input class="input" id="fResponsavel" placeholder="Nome do responsável" maxlength="80" autocomplete="off">
        </div>
        <div class="field" id="fEscritorioWrap">
          <label class="field-label">Escritório</label>
          <select class="select" id="fEscritorio"><option value="">A carregar…</option></select>
        </div>
        <div class="field full">
          <label class="field-label">Descrição / objetivo</label>
          <textarea class="textarea" id="fDescricao" rows="3" placeholder="Objetivo e detalhes da visita…" maxlength="500"></textarea>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-secondary" onclick="closeForm()">Cancelar</button>
      <button class="btn btn-primary" onclick="submitVisita()">Registar visita</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/utils.js"></script>
<script src="js/module-registry.js"></script>
<script src="js/auth.js"></script>
<script src="js/auditoria.js"></script>
<script src="js/offices-service.js"></script>
<script src="js/config-escritorios.js"></script>
<script src="js/app-platform.js"></script>
<script src="js/visitas-service.js"></script>
<script src="js/visitas.js"></script>
</body>
</html>
