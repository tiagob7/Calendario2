<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarefas</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="css/tarefas.css">
<script>if(localStorage.getItem('darkMode')==='1')document.documentElement.classList.add('dark');</script>
</head>
<body>

<div class="page">

  <!-- ── Page header ── -->
  <div class="page-head page-header">
    <div>
      <div class="kicker">Produtividade</div>
      <h1>Tarefas</h1>
      <p class="lede">Acompanha o trabalho das equipas com kanban arrastável.</p>
    </div>
    <div class="hd-actions page-header-actions">
      <span id="syncStatus"></span>
      <button class="btn btn-primary btn-sm" id="btnNovaTarefa" onclick="openTaskForm()">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M8 2v12M2 8h12"/></svg>
        Nova tarefa
      </button>
    </div>
  </div>

  <!-- ── Toolbar ── -->
  <div class="toolbar-card">
    <div class="seg-ctrl" id="filterBtns">
      <button class="seg-btn active" data-f="activos"   onclick="setFilter('activos')">Activos</button>
      <button class="seg-btn"        data-f="todos"     onclick="setFilter('todos')">Todos</button>
      <button class="seg-btn"        data-f="concluido" onclick="setFilter('concluido')">Concluídos</button>
    </div>
    <div class="tb-sep"></div>
    <select class="filter-select-sm" id="filterPessoa" onchange="setFilterPessoa(this.value)">
      <option value="">Todos os criadores</option>
    </select>
    <select id="filterEscritorio" class="filter-select-sm is-hidden" onchange="setFilterEscritorio(this.value)"></select>
    <div class="tb-right">
      <span class="count-badge" id="countBadge"></span>
    </div>
  </div>

  <!-- ── Kanban board ── -->
  <div class="kanban" id="kanbanBoard">

    <div class="kanban-col" id="col-aguardar"
         ondragover="event.preventDefault();onDragOver('aguardar')"
         ondragleave="onDragLeave('aguardar')"
         ondrop="onDrop('aguardar')">
      <div class="kanban-head">
        <div class="kanban-head-left">
          <span class="col-dot tone-aguardar"></span>
          <span class="col-title">A aguardar</span>
          <span class="col-count" id="count-aguardar">0</span>
        </div>
        <button class="col-add-btn" onclick="openTaskForm()" title="Nova tarefa">+</button>
      </div>
      <div class="kanban-body" id="body-aguardar"></div>
    </div>

    <div class="kanban-col" id="col-progresso"
         ondragover="event.preventDefault();onDragOver('progresso')"
         ondragleave="onDragLeave('progresso')"
         ondrop="onDrop('progresso')">
      <div class="kanban-head">
        <div class="kanban-head-left">
          <span class="col-dot tone-progresso"></span>
          <span class="col-title">Em progresso</span>
          <span class="col-count" id="count-progresso">0</span>
        </div>
        <button class="col-add-btn" onclick="openTaskForm()" title="Nova tarefa">+</button>
      </div>
      <div class="kanban-body" id="body-progresso"></div>
    </div>

    <div class="kanban-col" id="col-pendente"
         ondragover="event.preventDefault();onDragOver('pendente')"
         ondragleave="onDragLeave('pendente')"
         ondrop="onDrop('pendente')">
      <div class="kanban-head">
        <div class="kanban-head-left">
          <span class="col-dot tone-pendente"></span>
          <span class="col-title">Pendente</span>
          <span class="col-count" id="count-pendente">0</span>
        </div>
        <button class="col-add-btn" onclick="openTaskForm()" title="Nova tarefa">+</button>
      </div>
      <div class="kanban-body" id="body-pendente"></div>
    </div>

    <div class="kanban-col" id="col-concluido"
         ondragover="event.preventDefault();onDragOver('concluido')"
         ondragleave="onDragLeave('concluido')"
         ondrop="onDrop('concluido')">
      <div class="kanban-head">
        <div class="kanban-head-left">
          <span class="col-dot tone-concluido"></span>
          <span class="col-title">Concluído</span>
          <span class="col-count" id="count-concluido">0</span>
        </div>
      </div>
      <div class="kanban-body" id="body-concluido"></div>
    </div>

  </div><!-- /.kanban -->

</div><!-- /.page -->

<!-- ══ Task Detail Modal ══ -->
<div class="modal-overlay" id="taskDetailModal" onclick="if(event.target===this)closeTaskDetail()">
  <div class="modal modal-lg" onclick="event.stopPropagation()">
    <div class="modal-head">
      <span class="modal-title" id="taskDetailTitle">Tarefa</span>
      <button class="modal-close" onclick="closeTaskDetail()">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l10 10M13 3L3 13"/></svg>
      </button>
    </div>
    <div class="modal-body" id="taskDetailBody"></div>
    <div class="modal-foot" id="taskDetailFoot">
      <button class="btn btn-secondary" onclick="closeTaskDetail()">Fechar</button>
    </div>
  </div>
</div>

<!-- ══ Task Form Modal ══ -->
<div class="modal-overlay" id="taskFormModal" onclick="if(event.target===this)closeTaskForm()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-head">
      <span class="modal-title">Nova tarefa</span>
      <button class="modal-close" onclick="closeTaskForm()">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l10 10M13 3L3 13"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="field full">
          <label class="field-label">Título *</label>
          <input class="input" id="fTitulo" placeholder="ex: Relatório mensal — Cliente X" maxlength="100" autocomplete="off">
        </div>
        <div class="field full">
          <label class="field-label">Descrição</label>
          <textarea class="textarea" id="fDescricao" rows="2" placeholder="ex: Enviar até sexta com anexo PDF" maxlength="400"></textarea>
        </div>
        <div class="field">
          <label class="field-label">Escritório</label>
          <select class="select" id="fEscritorio"></select>
        </div>
        <div class="field">
          <label class="field-label">Prioridade</label>
          <div class="prio-row">
            <button type="button" class="prio-pill" data-p="urgente" onclick="selPrio('urgente')">Urgente</button>
            <button type="button" class="prio-pill sel" data-p="normal" onclick="selPrio('normal')">Normal</button>
            <button type="button" class="prio-pill" data-p="baixa" onclick="selPrio('baixa')">Baixa</button>
          </div>
        </div>
        <div class="field full">
          <div class="user-badge">
            <div class="user-ava" id="userAvatar">?</div>
            <span class="user-name" id="userName">A carregar…</span>
          </div>
        </div>
        <div class="field full">
          <label class="field-label">Anexos (opcional)</label>
          <label class="btn-attach">
            📎 Adicionar ficheiros
            <input type="file" id="fFicheiros" multiple onchange="onPendingFilesChange(this)">
          </label>
          <div id="pendingFilesList" class="pending-files-list"></div>
          <div class="upload-status" id="formUploadStatus"></div>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-secondary" onclick="closeTaskForm()">Cancelar</button>
      <button class="btn btn-primary" onclick="submitTarefa()">Criar tarefa</button>
    </div>
  </div>
</div>

<!-- ══ Confirm Modal ══ -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-head">
      <span class="modal-title" id="confirmTitle">Confirmar</span>
    </div>
    <div class="confirm-body" id="confirmBody"></div>
    <div class="confirm-foot">
      <button class="btn btn-secondary" id="confirmCancel">Cancelar</button>
      <button class="btn btn-danger" id="confirmOk">Confirmar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- ══ Arquivo Modal ══ -->
<div class="modal-overlay" id="arquivoModal" onclick="if(event.target===this)closeArquivoModal()">
  <div class="modal modal-lg" onclick="event.stopPropagation()">
    <div class="modal-head">
      <span class="modal-title">Arquivo de tarefas</span>
      <button class="modal-close" onclick="closeArquivoModal()">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l10 10M13 3L3 13"/></svg>
      </button>
    </div>
    <div class="modal-body" style="padding:0">
      <div class="arquivo-search-bar">
        <input class="input" id="arquivoSearch" placeholder="Pesquisar por título…"
               oninput="onArquivoSearch(this.value)" autocomplete="off">
      </div>
      <div id="arquivoList" class="arquivo-list"></div>
      <div id="arquivoLoadMore" class="arquivo-load-more" style="display:none">
        <button class="btn btn-secondary" onclick="loadMaisArquivo()">Carregar mais</button>
      </div>
    </div>
    <div class="modal-foot">
      <span class="arquivo-count-info" id="arquivoCountInfo"></span>
      <button class="btn btn-secondary" onclick="closeArquivoModal()">Fechar</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/utils.js"></script>
<script src="js/module-registry.js"></script>
<script src="js/auth.js"></script>
<script src="js/auditoria.js"></script>
<script src="js/offices-service.js"></script>
<script src="js/config-escritorios.js"></script>
<script src="js/app-platform.js"></script>
<script src="js/chat-badge.js"></script>
<script src="js/tasks-service.js"></script>
<script src="js/tarefas.js"></script>


</body>
</html>
