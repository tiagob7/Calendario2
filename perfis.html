<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfis de Permissão</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="css/perfis.css">
<script>if(localStorage.getItem('darkMode')==='1')document.documentElement.classList.add('dark');</script>
</head>
<body>

<div class="page">

  <div class="page-head">
    <div>
      <div class="kicker">Administração</div>
      <h1>Perfis de Permissão</h1>
      <p class="lede">Define perfis reutilizáveis de permissões e atribui-os aos colaboradores da organização.</p>
    </div>
    <div class="actions">
      <span id="meInfo" style="font-size:11px;color:var(--muted);"></span>
      <button class="btn btn-primary" onclick="window.abrirPerfilModal && window.abrirPerfilModal(null)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px;"><path d="M8 2v12M2 8h12"/></svg>
        Novo Perfil
      </button>
    </div>
  </div>

  <div class="perfis-grid" id="perfisGrid">
    <div class="perfil-card" style="border-style:dashed;align-items:center;justify-content:center;min-height:110px;">
      <span style="font-size:11px;color:var(--muted);">A carregar…</span>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- ── Modal edição/criação de perfil ── -->
<div class="modal-overlay" id="modalPerfil">
  <div class="modal-v2" style="width:600px;">
    <div class="modal-head">
      <h3 id="modalTitle">Novo Perfil</h3>
      <button class="icon-btn" onclick="document.getElementById('modalPerfil').classList.remove('open')" title="Fechar">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><path d="M4 4l8 8M12 4l-8 8"/></svg>
      </button>
    </div>
    <div class="modal-body modal-scrollable">
      <label class="field-label">Nome do perfil</label>
      <input class="input-v2" type="text" id="perfilNome" placeholder="Ex: Rececionista" style="margin-bottom:16px;">
      <div class="matrix-label">Permissões por módulo</div>
      <div class="matrix" id="permMatrix"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-secondary" id="btnCancelarModal">Cancelar</button>
      <button class="btn btn-primary" id="btnGuardarPerfil">Guardar</button>
    </div>
  </div>
</div>

<!-- ── Confirm delete ── -->
<div class="modal-overlay" id="confirmOverlay">
  <div class="modal-v2" style="width:400px;">
    <div class="modal-head">
      <h3>Apagar perfil?</h3>
    </div>
    <div class="modal-body">
      <p style="font-size:12px;color:var(--muted);line-height:1.8;" id="confirmText"></p>
    </div>
    <div class="modal-foot">
      <button class="btn btn-secondary" id="btnConfirmCancel">Cancelar</button>
      <button class="btn btn-danger" id="btnConfirmOk">Apagar</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/utils.js"></script>
<script src="js/module-registry.js"></script>
<script src="js/auth.js"></script>
<script src="js/auditoria.js"></script>
<script src="js/offices-service.js"></script>
<script src="js/config-escritorios.js"></script>
<script src="js/app-platform.js"></script>
<script src="js/chat-badge.js"></script>
<script src="js/perfis-service.js"></script>
<script src="js/perfis.js"></script>
</body>
</html>
